services:
  postgres:
    image: postgres:16
    container_name: bigdata_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oil_analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d oil_analytics"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: bigdata_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  pipeline:
    build: .
    container_name: bigdata_pipeline
    working_dir: /home/jovyan/work
    command: python scripts/run_pipeline.py --seed
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: oil_analytics
      PGUSER: analytics
      PGPASSWORD: analytics
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      S3_BUCKET: oil-lakehouse
    volumes:
      - ./:/home/jovyan/work
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  jupyterhub:
    build: .
    container_name: bigdata_jupyterhub
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: "12345"
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: oil_analytics
      PGUSER: analytics
      PGPASSWORD: analytics
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      S3_BUCKET: oil-lakehouse
    volumes:
      - ./:/home/jovyan/work
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: bigdata_superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: bigdata_homework_secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      ADMIN_EMAIL: admin@example.com
      DATABASE_URL: postgresql+psycopg2://analytics:analytics@postgres:5432/oil_analytics
    command: >
      /bin/sh -c "superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User
      --email admin@example.com --password admin || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8088/health')\""]
      interval: 10s
      timeout: 10s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy

  superset_setup:
    build: .
    container_name: bigdata_superset_setup
    working_dir: /home/jovyan/work
    command: python scripts/setup_superset.py
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_USERNAME: admin
      SUPERSET_PASSWORD: admin
      SUPERSET_DATABASE_URI: postgresql+psycopg2://analytics:analytics@postgres:5432/oil_analytics
      SUPERSET_DATABASE_NAME: Oil Analytics PostgreSQL
    volumes:
      - ./:/home/jovyan/work
    depends_on:
      pipeline:
        condition: service_completed_successfully
      superset:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
